name: Verify

# Lint, unit tests, and the production build. Nothing deploys and no secrets are used
# (Vercel's own GitHub link handles deployment).
#
# This repository is public. A pull request from a fork runs the workflow file
# from that pull request, so an outsider can rewrite the steps. Those jobs must
# not target a self-hosted runner: the private machine would execute the rewritten
# workflow. push to main and workflow_dispatch are trusted, and they use the same
# job — keeping a self-hosted runs-on anywhere in this file would put the
# pull_request path back on that machine. Every trigger therefore uses a
# GitHub-hosted runner, which is destroyed after the job.
#
# The previous job ran in node:22-bookworm on the personal runner pool. That image
# supplied Node 22, git, and Corepack. ubuntu-latest does not pin Node 22.23.4
# (.nvmrc), so setup-node installs it before .github/scripts/verify.sh enables
# Corepack and pnpm.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Run the checks
        run: bash .github/scripts/verify.sh
